[package]
name                   = "dreamcli"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Schema-first, typed Rust CLI framework"
license.workspace      = true

[package.metadata.docs.rs]
all-features = true

[[example]]
name              = "greet"
required-features = ["completion"]

[[example]]
name              = "deploy"
required-features = ["completion"]

[[example]]
name              = "batch"
required-features = ["completion"]

[[example]]
name              = "release"
required-features = ["completion", "url"]

[[example]]
name              = "settings"
required-features = ["completion", "url"]

[[example]]
name              = "terminal"
required-features = ["completion", "terminal-activity"]

[[example]]
name              = "async_build"
required-features = ["completion"]

[dependencies]
dreamcli-complete         = { workspace = true, optional = true }
dreamcli-core.workspace   = true
dreamcli-output.workspace = true
rpassword                 = { version = "7", optional = true }
serde.workspace           = true
serde_json.workspace      = true
unicode-width.workspace   = true

[dev-dependencies]
tempfile.workspace = true
tokio              = { version = "1", features = ["macros", "rt", "time"] }

[features]
default           = ["completion", "terminal-activity", "terminal-prompts"]
chrono            = ["dreamcli-core/chrono"]
completion        = ["dep:dreamcli-complete"]
regex             = ["dreamcli-core/regex"]
shell-tests       = ["completion"]
terminal-activity = ["dreamcli-output/terminal-activity"]
terminal-prompts  = ["dep:rpassword"]
url               = ["dreamcli-core/url"]

[lints]
workspace = true
