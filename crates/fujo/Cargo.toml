[package]
name                   = "fujo"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Schema-first, typed Rust CLI framework"
license.workspace      = true

[package.metadata.docs.rs]
all-features = true

[[example]]
name              = "greet"
required-features = ["completion"]

[[example]]
name              = "deploy"
required-features = ["completion"]

[[example]]
name              = "batch"
required-features = ["completion"]

[[example]]
name              = "release"
required-features = ["completion", "url"]

[[example]]
name              = "settings"
required-features = ["completion", "url"]

[[example]]
name              = "terminal"
required-features = ["completion", "terminal-activity"]

[[example]]
name              = "async_build"
required-features = ["completion"]

[[example]]
name              = "manifest"
required-features = ["completion"]

[dependencies]
fujo-complete         = { workspace = true, optional = true }
fujo-core.workspace   = true
fujo-output.workspace = true
rpassword             = { version = "7", optional = true }
serde.workspace       = true
serde_json.workspace  = true

[dev-dependencies]
tempfile.workspace = true
tokio              = { version = "1", features = ["macros", "rt", "sync", "time"] }

[features]
default           = ["completion", "terminal-activity", "terminal-prompts"]
chrono            = ["fujo-core/chrono"]
completion        = ["dep:fujo-complete"]
regex             = ["fujo-core/regex"]
shell-tests       = ["completion"]
terminal-activity = ["fujo-output/terminal-activity"]
terminal-prompts  = ["dep:rpassword"]
url               = ["fujo-core/url"]

[lints]
workspace = true
