[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
authors      = ["Kaj Kowalski"]
edition      = "2024"
rust-version = "1.99"
readme       = "README.md"
repository   = "https://github.com/kjanat/fujo"
license      = "MIT"

[workspace.dependencies]
chrono        = { version = "0.4", default-features = false, features = ["serde", "std"] }
fujo-complete = { path = "crates/fujo-complete", version = "0.1.0" }
fujo-core     = { path = "crates/fujo-core", version = "0.1.0", default-features = false }
fujo-error    = { path = "crates/fujo-error", version = "0.1.0" }
fujo-output   = { path = "crates/fujo-output", version = "0.1.0", default-features = false }
regex         = "1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tempfile      = "3"
unicode-width = "0.2"
url           = { version = "2", features = ["serde"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo      = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
