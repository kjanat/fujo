[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
authors      = ["Kaj Kowalski"]
edition      = "2024"
rust-version = "1.99"
license      = "MIT"

[workspace.dependencies]
chrono            = { version = "0.4", default-features = false, features = ["serde", "std"] }
dreamcli-complete = { path = "crates/dreamcli-complete", version = "0.1.0" }
dreamcli-core     = { path = "crates/dreamcli-core", version = "0.1.0" }
dreamcli-error    = { path = "crates/dreamcli-error", version = "0.1.0" }
dreamcli-output   = { path = "crates/dreamcli-output", version = "0.1.0" }
regex             = "1"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tempfile          = "3"
unicode-width     = "0.2"
url               = { version = "2", features = ["serde"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo      = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
