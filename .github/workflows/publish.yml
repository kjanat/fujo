name: Publish crates
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
concurrency:
  group: crates-io-publish
  cancel-in-progress: false
defaults: { run: { shell: bash } }
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  release:
    name: Validate release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
      - name: Require a commit on master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Match the tag to every published crate
        uses: $/.github/actions/check-release
        with: { tag: "${{ github.ref_name }}" }
  checks: {
    name: Release checks,
    needs: release,
    uses: $/.github/workflows/ci.yml,
  }
  publish:
    name: Publish workspace to crates.io
    permissions: { contents: read, id-token: write }
    needs: [release, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish all crates in dependency order
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}" }
        run: cargo publish --workspace --locked --all-features --registry crates-io
