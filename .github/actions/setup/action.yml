name: Set up the workspace
description: Install the Rust toolchain declared by the selected workspace
inputs:
  workspace:
    description: Absolute path to the workspace directory
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - uses: kjanat/runner@master
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with: { python-version-file: "${{ inputs.workspace }}/.python-version" }
    - id: version
      shell: bash
      env: { RUNNER_DIR: "${{ inputs.workspace }}" }
      run: run rustup toolchain install
