name: Set up the workspace
description: Install the Rust toolchain declared by the selected workspace
inputs:
  workspace:
    description: Workspace directory relative to the checkout root
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - id: version
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        python - <<'PY' >> "${GITHUB_OUTPUT}"
        import os
        import pathlib
        import tomllib
        manifest = pathlib.Path(os.environ["WORKSPACE"]) / "rust-toolchain.toml"
        toolchain = tomllib.loads(manifest.read_text())["toolchain"]["channel"]
        print(f"toolchain={toolchain}")
        PY
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      with:
        toolchain: ${{ steps.version.outputs.toolchain }}
        components: clippy,rustfmt
